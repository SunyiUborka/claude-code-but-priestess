name: Sync upstream

on:
  schedule:
    # 每天 UTC 6:00 检查上游更新
    - cron: "0 6 * * *"
  workflow_dispatch: # 也可手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check upstream changes
        id: check
        run: |
          git remote add upstream https://github.com/SVAH-X/claude-code-but-priestess.git
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi

          echo "Upstream has $BEHIND new commit(s)."

      - name: Merge upstream
        if: steps.check.outputs.behind > 0
        run: |
          git config user.name "aklnaaw"
          git config user.email "aklnaaww@gmail.com"

          # Try to merge upstream/main
          if git merge upstream/main --no-edit; then
            echo "Merge successful."
          else
            echo "Merge conflict! Creating issue for manual resolution."
            echo "CONFLICT=1" >> $GITHUB_ENV
            exit 0
          fi

      - name: Create conflict issue
        if: env.CONFLICT == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream merge conflict detected',
              body: 'Auto-merge of upstream/main failed with conflicts. Please resolve manually:\n\n'
                + '```\ngit remote add upstream https://github.com/SVAH-X/claude-code-but-priestess.git\n'
                + 'git fetch upstream\n'
                + 'git merge upstream/main\n'
                + '# resolve conflicts, then:\n'
                + 'git commit\n'
                + 'git push origin main\n'
                + '```'
            })

      - name: Push merge and tag
        if: env.CONFLICT != '1' && steps.check.outputs.behind > 0
        run: |
          # Extract new version from upstream package.json
          NEW_VER=$(git show HEAD:package.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "New version: $NEW_VER"

          # Update PKGBUILD version
          sed -i "s/^pkgver=.*/pkgver=$NEW_VER/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

          git add packaging/aur/PKGBUILD
          git commit -m "chore: bump to $NEW_VER"

          # Push merged code
          git push origin main

          # Create tag and push (triggers aur-publish workflow)
          git tag "v$NEW_VER"
          git push origin "v$NEW_VER"
