name: Publish to AUR

on:
  push:
    tags:
      - "v*"

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_rsa_aur
          chmod 600 ~/.ssh/id_rsa_aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Push to AUR
        run: |
          PKGVER=$(grep "^pkgver=" packaging/aur/PKGBUILD | cut -d= -f2)
          if [ "$PKGVER" != "${GITHUB_REF_NAME#v}" ]; then
            echo "ERROR: PKGBUILD version ($PKGVER) != tag (${GITHUB_REF_NAME#v})"
            exit 1
          fi

          # Clone existing AUR repo
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa_aur" git clone ssh://aur@aur.archlinux.org/priestess-arknights.git aur
          cd aur

          # Replace files with new versions
          cp ../packaging/aur/PKGBUILD .
          cp ../packaging/aur/priestess.install .

          git config user.name "aklnaaw"
          git config user.email "aklnaaww@gmail.com"
          git add -A
          git commit -m "Update to ${GITHUB_REF_NAME}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa_aur" git push origin master
